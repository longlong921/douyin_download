services:
  app:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      DOUYIN_COOKIE: ${DOUYIN_COOKIE:-}
      MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-536870912}
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-4}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-1800}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
