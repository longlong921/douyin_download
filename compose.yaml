services:
  app:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8187}:8187"
    environment:
      BIND_ADDRESS: 0.0.0.0
      PORT: 8187
      BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
